name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Типы, сборка и тесты
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      # База настоящая только для интеграционных тестов, остальные адреса -
      # заглушки: next.config требует переменные на этапе сборки.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      REDIS_URL: redis://localhost:6379
      GATEWAY_URL: http://localhost:3001
      NEXT_PUBLIC_BASE_URL: http://localhost
      NEXT_PUBLIC_BASE_DEPLOY_URL: http://localhost
      NEXT_PUBLIC_WS_URL: ws://localhost/collab
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Включить Corepack
        run: corepack enable

      - name: Установить зависимости
        run: yarn install --immutable

      - name: Собрать общие пакеты
        run: yarn packages:build

      - name: Проверить типы
        run: yarn typecheck

      - name: Линтер фронтенда
        run: yarn web lint

      - name: Юнит-тесты
        run: yarn test

      - name: Применить миграции
        run: yarn workspace @power-paint/db migrate:deploy

      - name: Интеграционные тесты (нужны Redis и Postgres)
        env:
          RUN_INTEGRATION_TESTS: "true"
        run: |
          yarn gateway test
          yarn events test
          yarn boards test

      - name: Сборка сервисов
        run: |
          yarn auth build
          yarn users build
          yarn boards build
          yarn gateway build
          yarn collab build
          yarn migrator build

      - name: Сборка фронтенда
        run: yarn web build
