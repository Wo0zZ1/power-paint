services:
  db:
    restart: unless-stopped
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
      POSTGRES_DB: $POSTGRES_DB
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [power-paint-network]

  # Потоки событий живут в Redis, и без журнала рестарт контейнера стёр бы
  # ещё не обработанные события.
  redis:
    restart: unless-stopped
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [power-paint-network]

  # Применяет миграции и завершается. Остальные сервисы ждут его успешного
  # завершения, иначе стартуют на схеме, которой ещё нет. restart ему не нужен:
  # перезапуск после успешного выхода снова гонял бы миграции.
  migrator:
    build:
      context: .
      dockerfile: docker/service.dockerfile
      args:
        SERVICE: migrator
    environment:
      DATABASE_URL: $DATABASE_URL
      RUN_SEED: $RUN_SEED
    networks: [power-paint-network]
    depends_on:
      db:
        condition: service_healthy

  auth:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/service.dockerfile
      args:
        SERVICE: auth
    environment:
      DATABASE_URL: $DATABASE_URL
      REDIS_URL: $REDIS_URL
      USERS_SERVICE_URL: $USERS_SERVICE_URL
      PUBLIC_BASE_URL: $PUBLIC_BASE_URL
      AUTH_GOOGLE_ID: $AUTH_GOOGLE_ID
      AUTH_GOOGLE_SECRET: $AUTH_GOOGLE_SECRET
      AUTH_GITHUB_ID: $AUTH_GITHUB_ID
      AUTH_GITHUB_SECRET: $AUTH_GITHUB_SECRET
      EMAIL_HOST: $EMAIL_HOST
      EMAIL_PORT: $EMAIL_PORT
      EMAIL_LOGIN: $EMAIL_LOGIN
      EMAIL_PASSWORD: $EMAIL_PASSWORD
      COOKIE_SECURE: $COOKIE_SECURE
      PORT: 3002
    networks: [power-paint-network]
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  users:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/service.dockerfile
      args:
        SERVICE: users
    environment:
      DATABASE_URL: $DATABASE_URL
      PORT: 3003
    networks: [power-paint-network]
    depends_on:
      migrator:
        condition: service_completed_successfully

  boards:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/service.dockerfile
      args:
        SERVICE: boards
    environment:
      DATABASE_URL: $DATABASE_URL
      REDIS_URL: $REDIS_URL
      USERS_SERVICE_URL: $USERS_SERVICE_URL
      PORT: 3004
    networks: [power-paint-network]
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  collab:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/service.dockerfile
      args:
        SERVICE: collab
    environment:
      DATABASE_URL: $DATABASE_URL
      REDIS_URL: $REDIS_URL
      BOARDS_SERVICE_URL: $BOARDS_SERVICE_URL
      PORT: 3005
    networks: [power-paint-network]
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/web.dockerfile
      args:
        NEXT_PUBLIC_BASE_URL: $NEXT_PUBLIC_BASE_URL
        NEXT_PUBLIC_BASE_DEPLOY_URL: $NEXT_PUBLIC_BASE_DEPLOY_URL
        NEXT_PUBLIC_WS_URL: $NEXT_PUBLIC_WS_URL
    environment:
      GATEWAY_URL: $GATEWAY_URL
      PORT: 3000
    networks: [power-paint-network]

  gateway:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/service.dockerfile
      args:
        SERVICE: gateway
    environment:
      REDIS_URL: $REDIS_URL
      AUTH_SERVICE_URL: $AUTH_SERVICE_URL
      USERS_SERVICE_URL: $USERS_SERVICE_URL
      BOARDS_SERVICE_URL: $BOARDS_SERVICE_URL
      COLLAB_SERVICE_URL: $COLLAB_SERVICE_URL
      WEB_SERVICE_URL: $WEB_SERVICE_URL
      TRUSTED_PROXIES: $TRUSTED_PROXIES
      PORT: 3001
    networks: [power-paint-network]
    depends_on:
      redis:
        condition: service_healthy

  nginx:
    restart: unless-stopped
    image: nginx:alpine
    container_name: power-paint-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Под именем default.conf шаблон заменяет одноимённый конфиг образа: иначе тот
      # со своим server_name localhost перехватывал бы запросы на localhost.
      - ./nginx/templates/power-paint.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      DOMAIN: $DOMAIN
      GATEWAY_HOST: gateway
      GATEWAY_PORT: 3001
    ports:
      - "80:80"
    networks: [power-paint-network]
    depends_on:
      - gateway

networks:
  power-paint-network:
    driver: bridge

volumes:
  pgdata:
  redisdata:
